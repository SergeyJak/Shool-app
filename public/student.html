<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>School App · Ученик</title>
  <link rel="stylesheet" href="/styles.css?v=20260930-auth1" />
  <link rel="stylesheet" href="/pdf-view.css?v=20261003-mobile-sync2" />
  <link rel="stylesheet" href="/lesson-comms.css?v=20261004-assets3" />
  <link rel="stylesheet" href="/notebook.css?v=20261004-notebook2" />
</head>
<body data-role="student" class="pdf-view-page">
  <header class="pdf-header">
    <button class="pdf-back" type="button" onclick="history.back()" title="Назад" aria-label="Назад">‹</button>
    <div class="pdf-brand" aria-label="School App">
      <span class="pdf-brand-owl">🦉</span>
      <span>School <b>App</b></span>
    </div>
    <div class="pdf-lesson-title">
      <strong id="lessonTitle">Занятие</strong>
      <span id="status">подключение…</span>
    </div>
    <div class="pdf-header-actions">
      <div class="lesson-view-switch" role="group" aria-label="Режим урока">
        <button id="viewPdfBtn" class="active" type="button" aria-pressed="true">📖 <span>Учебник</span></button>
        <button id="viewNotebookBtn" type="button" aria-pressed="false">📓 <span>Тетрадь</span></button>
      </div>
      <button id="submitHomeworkBtn" class="pdf-action homework-submit" type="button" hidden>✓ Сдать</button>
      <a id="downloadPdfBtn" class="pdf-action" href="#" title="Скачать PDF" hidden>↓ PDF</a>
    </div>
  </header>

  <main id="lessonPdfMain">
    <div class="lesson-sync-row compact-sync">
      <div id="followStatus" class="follow-status" hidden>🔗 Учитель ведёт страницу</div>
    </div>
    <div class="toolbar">
      <button id="penBtn" class="tool-icon-btn" type="button" title="Ручка" aria-label="Ручка"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.2-1 10.9-10.9a2 2 0 0 0 0-2.8l-.4-.4a2 2 0 0 0-2.8 0L5 15.8 4 20z"/><path d="M14.8 6l3.2 3.2M5 15.8l3.2 3.2"/></svg></button>
      <button id="eraserBtn" class="tool-icon-btn" type="button" title="Ластик" aria-label="Ластик"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.5L3.8 15a2 2 0 0 1 0-2.8l7.4-7.4a2 2 0 0 1 2.8 0l6.2 6.2a2 2 0 0 1 0 2.8l-4.7 4.7H7.2z"/><path d="M9.4 9.6l5 5M15.5 18.5H21"/></svg></button>
      <button id="handBtn" class="active">Рука</button>
      <div class="desktop-shape-group" aria-label="Фигуры">
        <button id="lineBtn" class="desktop-shape-tool" type="button" title="Прямая линия" aria-label="Линия">╱</button>
        <button id="arrowBtn" class="desktop-shape-tool" type="button" title="Стрелка" aria-label="Стрелка">→</button>
        <button id="circleBtn" class="desktop-shape-tool" type="button" title="Круг" aria-label="Круг">○</button>
        <button id="ovalBtn" class="desktop-shape-tool" type="button" title="Овал" aria-label="Овал">⬭</button>
      </div>
      <div class="zoom-controls" aria-label="Масштаб">
        <button id="zoomOutBtn" type="button" title="Уменьшить">−</button>
        <button id="zoomResetBtn" type="button" title="Вписать по ширине">100%</button>
        <button id="zoomInBtn" type="button" title="Увеличить">+</button>
      </div>
      <button id="undoBtn">↶ Отменить</button>
      <span class="spacer"></span>
      <button id="firstBtn" title="В начало">«</button>
      <button id="prevBtn" title="Назад">‹</button>
      <span id="pageInfo" class="page-jump">
        <input id="pageInput" type="number" min="1" inputmode="numeric" aria-label="Номер страницы" />
        <span id="pageTotal">/ —</span>
      </span>
      <button id="nextBtn" title="Вперёд">›</button>
      <button id="lastBtn" title="В конец">»</button>
    </div>

    <div id="loadingState" class="loading-state">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingText">Проверяем документ…</div>
    </div>
    <div id="emptyState" hidden>Ждём, пока учитель загрузит PDF.</div>
    <div id="stage" hidden>
      <div id="pageShell">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </main>

  <section id="lessonNotebookView" class="lesson-notebook" hidden aria-label="Тетрадь урока">
    <div class="notebook-toolbar">
      <button id="notebookPenBtn" type="button">✎ Ручка</button>
      <button id="notebookEraserBtn" type="button">⌫ Ластик</button>
      <button id="notebookHandBtn" type="button">✋ Рука</button>
      <button id="notebookUndoBtn" type="button">↶ Отменить</button>
      <span class="notebook-spacer"></span>
      <button id="notebookFirstBtn" type="button" title="В начало">«</button>
      <button id="notebookPrevBtn" type="button" title="Назад">‹</button>
      <span class="notebook-page-jump">
        <input id="notebookPageInput" type="number" min="1" inputmode="numeric" aria-label="Страница тетради" />
        <span id="notebookPageTotal">/ 1</span>
      </span>
      <button id="notebookNextBtn" type="button" title="Вперёд">›</button>
      <button id="notebookLastBtn" type="button" title="В конец">»</button>
      <button id="notebookAddPageBtn" type="button">＋ Страница</button>
      <span id="notebookSaveState" class="notebook-save-state">сохранено</span>
    </div>
    <div id="notebookStage" class="notebook-stage">
      <div id="notebookPageShell" class="notebook-page-shell">
        <canvas id="notebookPaperCanvas"></canvas>
        <canvas id="notebookInkCanvas"></canvas>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script type="module" src="/app.js?v=20261004-huawei-pdf3"></script>
  <script type="module" src="/notebook.mjs?v=20261004-notebook2"></script>
  <script src="/student-session.js?v=20261002-1"></script>
</body>
</html>
