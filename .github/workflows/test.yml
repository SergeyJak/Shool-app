name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run test:layout
      - run: npm run test:student-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-dashboard-screenshots
          path: artifacts/student-dashboard/
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run test:student-games
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-game-screenshots
          path: artifacts/student-games/
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run test:student-interactions
      - run: npm run test:student-diagnostic
      - run: npm run test:rtc-browser
