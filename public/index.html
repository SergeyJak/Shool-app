<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>School App · Вход</title>
  <link rel="stylesheet" href="/login.css?v=20260930-auth1" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-mark">SA</div>
      <div class="login-copy">
        <span class="eyebrow">School App</span>
        <h1 id="loginTitle">Вход в кабинет</h1>
        <p>Учителя, ученики и администратор входят под своей учётной записью.</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <label>
          <span>Логин</span>
          <input id="username" name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          <span>Пароль</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <div id="loginError" class="login-error" role="alert" hidden></div>
        <button id="loginBtn" type="submit">Войти</button>
      </form>
    </section>
  </main>
  <script src="/login.js?v=20260930-auth1"></script>
</body>
</html>
