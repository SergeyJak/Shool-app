<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School App · Регистрация учителя</title>
  <link rel="stylesheet" href="/join.css?v=20261002-register1" />
</head>
<body>
  <main class="join-shell">
    <section class="join-card" aria-labelledby="registerTitle">
      <div class="join-mark">🦉</div>
      <span class="eyebrow">School App</span>
      <h1 id="registerTitle">Кабинет учителя</h1>
      <p>Создайте аккаунт, чтобы проводить уроки и отправлять ученикам ссылки без регистрации детей.</p>

      <form id="registerForm">
        <label>
          <span>Имя</span>
          <input id="displayName" name="displayName" maxlength="80" autocomplete="name" required />
        </label>
        <label>
          <span>Логин</span>
          <input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required />
        </label>
        <label>
          <span>Пароль</span>
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
        </label>
        <div id="registerError" class="error" hidden></div>
        <button id="registerBtn" type="submit">Создать кабинет</button>
      </form>
      <p class="auth-switch">Уже есть аккаунт? <a href="/#login">Войти</a></p>
    </section>
  </main>
  <script src="/register.js?v=20261002-1"></script>
</body>
</html>
