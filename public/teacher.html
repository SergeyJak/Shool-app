<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Shool App · Учитель</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-role="teacher">
  <header>
    <div>
      <strong>Учитель</strong>
      <span id="status">подключение…</span>
    </div>
    <label class="upload">
      Загрузить PDF
      <input id="pdfUpload" type="file" accept="application/pdf" hidden />
    </label>
  </header>

  <main>
    <div class="toolbar">
      <button id="penBtn" class="active">Ручка</button>
      <button id="eraserBtn">Ластик</button>
      <button id="undoBtn">↶ Отменить</button>
      <span class="spacer"></span>
      <button id="prevBtn">‹</button>
      <span id="pageInfo">—</span>
      <button id="nextBtn">›</button>
    </div>

    <div id="emptyState">Загрузите PDF, чтобы начать.</div>
    <div id="stage" hidden>
      <div id="pageShell">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
