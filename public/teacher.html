<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>School App · Учитель</title>
  <link rel="stylesheet" href="/styles.css?v=20260930-text2" />
</head>
<body data-role="teacher">
  <header>
    <div>
      <strong>Учитель</strong>
      <span id="status">подключение…</span>
    </div>
    <label class="upload">
      Загрузить PDF
      <input id="pdfUpload" type="file" accept="application/pdf" hidden />
    </label>
  </header>


  <main>
    <div class="lesson-sync-row">
      <button id="followBtn" class="follow-button" type="button">🔗 Вести ученика</button>
    </div>
    <div class="toolbar">
      <button id="penBtn" class="active">Ручка</button>
      <button id="eraserBtn">Ластик</button>
      <button id="handBtn">Рука</button>
      <button id="textBtn">Текст</button>
      <label class="text-size-control" title="Размер текста">
        <span>Шрифт</span>
        <select id="textSizeSelect" aria-label="Размер текста">
          <option value="12">12</option>
          <option value="14">14</option>
          <option value="18" selected>18</option>
          <option value="24">24</option>
          <option value="32">32</option>
          <option value="40">40</option>
          <option value="48">48</option>
        </select>
      </label>
      <div class="zoom-controls" aria-label="Масштаб">
        <button id="zoomOutBtn" type="button" title="Уменьшить">−</button>
        <button id="zoomResetBtn" type="button" title="Вписать по ширине">100%</button>
        <button id="zoomInBtn" type="button" title="Увеличить">+</button>
      </div>
      <button id="undoBtn">↶ Отменить</button>
      <span class="spacer"></span>
      <button id="firstBtn" title="В начало">«</button>
      <button id="prevBtn" title="Назад">‹</button>
      <span id="pageInfo" class="page-jump">
        <input id="pageInput" type="number" min="1" inputmode="numeric" aria-label="Номер страницы" />
        <span id="pageTotal">/ —</span>
      </span>
      <button id="nextBtn" title="Вперёд">›</button>
      <button id="lastBtn" title="В конец">»</button>
    </div>

    <div id="loadingState" class="loading-state">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingText">Проверяем документ…</div>
    </div>
    <div id="emptyState" hidden>Загрузите PDF, чтобы начать.</div>
    <div id="stage" hidden>
      <div id="pageShell">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
  <script type="module" src="/app.js?v=20260930-text2"></script>
</body>
</html>
