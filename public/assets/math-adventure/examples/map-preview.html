<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math adventure assets preview</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf6f2;color:#24334f;margin:0;padding:22px}.wrap{max-width:900px;margin:auto}h1{font-size:25px}.scene{position:relative;overflow:hidden;min-height:470px;background:#cce9dc url('../backgrounds/forest.svg') center/cover;border:6px solid white;border-radius:25px;box-shadow:0 8px 24px #2458a622}.road{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;width:68px;height:68px;border:0;background:none;cursor:pointer;padding:0}.node img{width:100%}.node:focus-visible{outline:4px solid #252dba;border-radius:50%}.hero{position:absolute;right:5%;bottom:3%;width:120px}.hud{position:absolute;top:16px;left:16px;padding:12px 16px;background:#ffffffee;border-radius:16px}.status{margin-top:14px;padding:15px;background:white;border-radius:15px}</style><main class="wrap"><h1>Математическое приключение</h1><p>Демо композиции отдельных SVG. Узлы кликабельны, прогресс учебный.</p><section class="scene"><img class="road" src="../map/winding-road.svg" alt=""><div class="hud">Глава 1 · Волшебный лес<br><small>Текущий этап: <b id="step">1</b> из 5</small></div><button class="node" style="left:10%;bottom:5%" data-step="1"><img src="../map/node-complete.svg" alt="Этап 1"></button><button class="node" style="left:34%;bottom:30%" data-step="2"><img src="../map/node-current.svg" alt="Этап 2"></button><button class="node" style="left:55%;bottom:50%" data-step="3"><img src="../map/node-challenge.svg" alt="Этап 3"></button><button class="node" style="left:68%;bottom:70%" data-step="4"><img src="../map/node-branch.svg" alt="Развилка"></button><button class="node" style="left:80%;top:7%" data-step="5"><img src="../map/node-boss.svg" alt="Босс"></button><img class="hero" src="../characters/owl-happy.svg" alt="Совёнок"></section><p class="status" id="status">Нажми на узел карты, чтобы проверить элементы интерфейса.</p></main><script>document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{document.getElementById('step').textContent=el.dataset.step;document.getElementById('status').textContent='Выбран этап '+el.dataset.step+' (демонстрация интерфейса, без подключения к прогрессу).'}));</script></html>
