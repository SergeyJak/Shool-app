name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:pdf
      - run: npm run test:math-progress
      - run: npm test > ci-npm-test.log 2>&1 || { cat ci-npm-test.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-npm-test-log
          path: ci-npm-test.log
          if-no-files-found: ignore
      - run: npm run test:layout
      - run: npm run test:student-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-dashboard-screenshots
          path: artifacts/student-dashboard/
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run test:student-games
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-game-screenshots
          path: artifacts/student-games/
          if-no-files-found: ignore
          retention-days: 30
      - run: npm run test:student-interactions
      - run: npm run test:math-hub
      - run: npm run test:math-adventure
      - run: npm run test:student-diagnostic > ci-student-diagnostic.log 2>&1 || { cat ci-student-diagnostic.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-student-diagnostic-log
          path: ci-student-diagnostic.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-diagnostic-logs
          path: |
            ci-npm-test.log
            ci-student-diagnostic.log
          if-no-files-found: ignore
      - run: npm run test:rtc-browser
